[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "switchspec"
version = "0.1.0"
description = "Lost at the Switch: speculative decoding on code-switched text (11-711 project)"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.56",
  "accelerate",
  "datasets",
  "numpy",
  "scipy",
  "pyyaml",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]
timing = ["vllm"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
