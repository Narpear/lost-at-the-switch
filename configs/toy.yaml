# Toy config for smoke tests: python scripts/make_toy_setup.py first.
pairs:
  qwen:
    drafter: toy/drafter
    target: toy/target
    # If scripts/sanity_check.py reports crop != recompute (e.g. hybrid linear-attention
    # layers), switch this to "recompute".
    cache_mode: crop

# Matches Paudel et al. setup as described in our proposal (Sec. 5, B1).
# ASSUMPTION: temperature 1.0 (the proposal does not state it).
sampling:
  temperature: 1.0
  top_k: 100
  top_p: 0.9
gammas: [2, 3, 4]
max_new_tokens: 128
seeds: [0, 1, 2, 3, 4]
switch_window: {k_before: 1, k_after: 2}
ngram_orders: [2, 3, 4]
