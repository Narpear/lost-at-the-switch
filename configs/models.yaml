# Drafter/target pairs. ASSUMPTION: Hugging Face model IDs below are our best guess
# for the checkpoints Paudel et al. (2026) used -- confirm base vs instruct and exact
# IDs against their paper/code before running baselines.
pairs:
  qwen:
    drafter: Qwen/Qwen3.5-0.8B
    target: Qwen/Qwen3.5-9B
    # Qwen3.5 is hybrid (gated-delta linear attention + full attention): "auto" picks
    # snapshot/restore. If sanity_check.py reports a MISMATCH, use "recompute".
    cache_mode: auto
  llama:
    drafter: meta-llama/Llama-3.2-1B        # gated: request access on HF first
    target: meta-llama/Llama-3.2-3B
    cache_mode: auto

# Paudel et al. (2026, arXiv 2605.30580): top-k 100, top-p 0.9, repetition penalty 1.1
# over a 16-token window, max 128 new tokens, chat templates, gamma swept 2-4.
# ASSUMPTION: temperature 1.0 (their paper only says "sampling-based inference").
sampling:
  temperature: 1.0
  top_k: 100
  top_p: 0.9
  repetition_penalty: 1.1
  rep_window: 16
gammas: [2, 3, 4]
max_new_tokens: 128
seeds: [0, 1, 2, 3, 4]
switch_window: {k_before: 1, k_after: 2}
ngram_orders: [2, 3, 4]
